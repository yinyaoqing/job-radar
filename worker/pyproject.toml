[project]
name = "job-radar"
version = "0.1.0"
description = "Daily remote-job radar: fetch postings from ATS APIs, verify they are open, assess eligibility and fit."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=1.15",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real ATS endpoints (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
