# Region trap set (docs/spec.md, 評估). Candidate: Taiwan, UTC+8, online 08:00-23:00.
# Written from patterns seen in remote job posts; no company names, no private notes.
#
# Each case: the ATS location field, the JD sentence(s), the location policy a correct
# extraction would produce, and the expected verdict. The rule eval feeds `policy` to the
# eligibility rules; the live eval extracts `text` with the LLM and compares the verdict.
#
# policy shorthand: type, countries, regions, tz: [from, to], overlap: [hours, reference_utc]

- id: worldwide-explicit
  trap: worldwide
  location: Remote
  text: This role is fully remote and open to candidates anywhere in the world.
  policy: {type: worldwide}
  expected: eligible

- id: worldwide-except-sanctions
  trap: worldwide
  location: Remote
  text: We can hire anywhere except in countries under US sanctions.
  policy: {type: worldwide}
  expected: eligible

