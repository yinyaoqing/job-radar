# Evidence store format, filled with a FICTIONAL person. Keep your real one in
# private/evidence.yaml (gitignored) and pass it with `job-radar cv --evidence`.
#
# Every claim must be something you can show (a repo, a link, a reference). The CV
# generator may only reword these; the lint fails any sentence that cites nothing.

profile:
